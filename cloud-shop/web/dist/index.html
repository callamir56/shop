    <title>Cloud Shop</title>
    <script type="module" crossorigin src="./assets/index-Boshmj7e.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-B9kl2aK_.css">
  </head>
  <body>
    <div id="app"></div>
  <script>
let currentVoiceAudio = null;
window.addEventListener('message', function(e) {
  if (e.data && e.data.action === 'playCustomVoice' && e.data.file) {
    try {
      if (currentVoiceAudio) {
        currentVoiceAudio.pause();
        currentVoiceAudio.currentTime = 0;
      }
      currentVoiceAudio = new Audio('./' + encodeURI(e.data.file));
      currentVoiceAudio.volume = 0.8;
      currentVoiceAudio.play().catch((err) => { console.error("[cloud-shop] Voice play error:", err); });
    } catch (err) {}
  }
});
</script>
</body>
</html>
